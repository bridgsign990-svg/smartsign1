<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SMART SIGN Call - {{ room_id }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap"/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
<style>
  :root { color-scheme: dark; }
  body {
    margin:0;
    min-height:100vh;
    background:#101312;
    color:#fff;
    font-family:'Lato',sans-serif;
    overflow:hidden;
  }
  .call-header {
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:0 22px;
    background:rgba(10,12,12,.88);
    border-bottom:1px solid rgba(255,255,255,.08);
    position:relative;
    z-index:10;
  }
  .call-brand { min-width:0; }
  .call-brand h1 {
    margin:0;
    font-family:'Playfair Display',serif;
    font-size:1.35rem;
    color:var(--honey);
  }
  .call-brand span {
    display:block;
    color:rgba(255,255,255,.62);
    font-size:.78rem;
    margin-top:2px;
  }
  .call-link-warning {
    margin:0;
    padding:10px 20px;
    background:rgba(247,184,86,.16);
    color:#ffd98a;
    font-size:.9rem;
  }
  .call-invite-expiry {
    margin:0;
    padding:7px 20px;
    color:rgba(255,255,255,.68);
    font-size:.8rem;
  }
  .call-header-actions {
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .room-code {
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    padding:8px 10px;
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.72);
    font-size:.78rem;
  }
  .room-code strong {
    color:#fff;
    letter-spacing:.08em;
  }
  .call-select,
  .call-input {
    border:1px solid rgba(255,255,255,.16);
    border-radius:8px;
    background:#1f2423;
    color:#fff;
    font:inherit;
    padding:9px 10px;
    outline:none;
  }
  .call-link,
  .call-btn {
    min-height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border:0;
    border-radius:8px;
    padding:0 13px;
    background:var(--teal);
    color:#fff;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
  }
  .call-link { background:rgba(255,255,255,.09); }
  .call-btn.secondary { background:rgba(255,255,255,.1); }
  .call-btn.danger { background:var(--terracotta); }
  .call-btn:disabled { opacity:.55; cursor:not-allowed; }
  .call-shell {
    height:calc(100vh - 68px);
    display:grid;
    grid-template-columns:minmax(0, 1fr) 360px;
    gap:0;
  }
  .video-stage {
    position:relative;
    min-width:0;
    background:#000;
    overflow:hidden;
  }
  .remote-video {
    width:100%;
    height:100%;
    object-fit:cover;
    background:#050505;
  }
  .local-video-wrap {
    position:absolute;
    top:18px;
    left:18px;
    width:min(220px, 28vw);
    aspect-ratio:4 / 3;
    border-radius:8px;
    overflow:hidden;
    border:2px solid var(--sage);
    background:#1c1c1c;
    box-shadow:0 12px 34px rgba(0,0,0,.42);
  }
  .local-video {
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    /* transform controlled by JS based on facingMode */
  }
  .status {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:4;
    color:rgba(255,255,255,.72);
    font-size:1rem;
    text-align:center;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    padding:12px 16px;
  }
  .caption-bar {
    position:absolute;
    left:50%;
    bottom:94px;
    transform:translateX(-50%);
    z-index:5;
    width:min(820px, 82%);
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(0,0,0,.58);
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    padding:13px 16px;
    color:#fff;
    font-size:clamp(1.05rem, 2.3vw, 1.7rem);
    font-weight:700;
    line-height:1.25;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    transition:transform .18s ease;
  }
  .call-controls {
    position:absolute;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  .assist-panel {
    min-width:0;
    border-left:1px solid rgba(255,255,255,.08);
    background:#151a19;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:auto;
  }
  .assist-title {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .assist-title h2 {
    margin:0;
    font-size:1rem;
    color:#fff;
  }
  .assist-title span {
    color:rgba(255,255,255,.58);
    font-size:.78rem;
  }
  #callAvatarContainer {
    width:100%;
    height:320px;
    border-radius:8px;
    overflow:hidden;
    position:relative;
    background:#1a1a1a;
    border:1px solid rgba(255,255,255,.1);
  }
  #callAvatarLoading {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,255,255,.72);
    font-family:monospace;
    text-align:center;
    padding:16px;
  }
  .transcript-panel {
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    background:rgba(255,255,255,.04);
    padding:12px;
    min-height:80px;
  }
  .transcript-label {
    color:rgba(255,255,255,.58);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:8px;
  }
  .transcript-text {
    color:#fff;
    line-height:1.5;
    word-break:break-word;
  }
  .call-chat-row {
    display:flex;
    gap:8px;
  }
  .call-chat-row .call-input { flex:1; min-width:0; }
  @media (max-width:900px) {
    body { overflow:auto; }
    .call-header { height:auto; align-items:flex-start; flex-direction:column; padding:12px; }
    .call-header-actions { width:100%; flex-wrap:wrap; }
    .call-shell { height:auto; min-height:calc(100vh - 122px); grid-template-columns:1fr; }
    .video-stage { min-height:58vh; }
    .assist-panel { border-left:0; border-top:1px solid rgba(255,255,255,.08); }
    .local-video-wrap { width:150px; }
    .caption-bar { bottom:104px; width:90%; }
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "/static/lib/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "/static/lib/GLTFLoader.js",
      "three/addons/": "/static/lib/",
      "@pixiv/three-vrm": "/static/lib/three-vrm.module.min.js"
    }
  }
</script>
</head>
<body>

<header class="call-header">
  <div class="call-brand">
    <h1>SMART SIGN Call</h1>
    <span id="connectionState">Room {{ room_id }}</span>
  </div>
  <div class="call-header-actions">
    <div class="room-code"><span>Code</span><strong>{{ room_id }}</strong></div>
    <select id="roleSelect" class="call-select" aria-label="Communication role">
      <option value="deaf">I sign - camera to speech</option>
      <option value="hearing">I speak - voice to signs</option>
    </select>
    <button class="call-btn secondary" id="copyLinkBtn" type="button">
      <i data-lucide="copy" width="16" height="16"></i>
      Copy Invite
    </button>
    <a class="call-link" href="/">
      <i data-lucide="home" width="16" height="16"></i>
      Home
    </a>
  </div>
</header>
{% if invite_warning %}
<p class="call-link-warning" role="status">{{ invite_warning }}</p>
{% endif %}
<p class="call-invite-expiry">Guest invitation expires after {{ invite_ttl_label }}.</p>

<main class="call-shell">
  <section class="video-stage">
    <div class="status" id="callStatus">Waiting for partner to join...</div>
    <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
    <div class="local-video-wrap">
      <video id="localVideo" class="local-video" autoplay playsinline muted></video>
      <canvas id="inferCanvas" style="display:none"></canvas>
    </div>
    <div class="caption-bar" id="captionBar">Waiting...</div>
    <div class="call-controls">
      <button class="call-btn secondary" id="muteBtn" type="button">
        <i data-lucide="mic" width="16" height="16"></i>
        Mute
      </button>
      <button class="call-btn secondary" id="cameraBtn" type="button">
        <i data-lucide="video" width="16" height="16"></i>
        Camera
      </button>
      <button class="call-btn secondary" id="flipCameraBtn" type="button" title="Switch between front and back camera">
        <i data-lucide="refresh-cw" width="16" height="16"></i>
        Back Cam
      </button>
      <button class="call-btn danger" id="endBtn" type="button">
        <i data-lucide="phone-off" width="16" height="16"></i>
        End
      </button>
    </div>
  </section>

  <aside class="assist-panel">
    <div class="assist-title">
      <h2>Sign Avatar</h2>
      <span id="callAvatarStatus">Ready</span>
    </div>
    <div id="callAvatarContainer">
      <div id="callAvatarLoading">Loading avatar...</div>
    </div>
    <div class="transcript-panel">
      <div class="transcript-label">Live text</div>
      <div class="transcript-text" id="callTranscript">Waiting for captions...</div>
    </div>
    <div class="call-chat-row">
      <input class="call-input" id="typedMessageInput" type="text" placeholder="Type text to sign or speak" autocomplete="off"/>
      <button class="call-btn" id="sendTextBtn" type="button">
        <i data-lucide="send" width="16" height="16"></i>
        Send
      </button>
    </div>
  </aside>
</main>

<script>
  window.ROOM_ID = {{ room_id|tojson }};
  window.CALL_USERNAME = {{ username|tojson }};
  window.CALL_INVITE_URL = {{ invite_url|tojson }};
  window.CALL_TURN_ICE_SERVERS = {{ turn_ice_servers|tojson }};
</script>
<script src="{{ url_for('static', filename='lib/mediapipe/camera_utils.js') }}"></script>
<script src="{{ url_for('static', filename='lib/mediapipe/hands.js') }}"></script>
<script src="{{ url_for('static', filename='avatar/cwasa_driver.js') }}?v=cwasa-asl-dict-20260521"></script>
<script type="module" src="{{ url_for('static', filename='avatar/avatar_controller.js') }}?v=cwasa-asl-dict-20260521"></script>
<script src="{{ url_for('static', filename='avatar/avatar_driver.js') }}?v=cwasa-asl-dict-20260521"></script>
<script src="{{ url_for('static', filename='performance-config.js') }}?v=speed-20260617"></script>
<script src="{{ url_for('static', filename='call.js') }}?v=call-role-flow-20260615"></script>
<script>
  if (typeof lucide !== "undefined") lucide.createIcons();
</script>
</body>
</html>
